config-version = 2
# ==============================================================================
# Core Settings
# Startup commands, normalization, and general behavior
# ==============================================================================

start-at-login = true
after-login-command = []

# Normalizations: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Default Layout
accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'
automatically-unhide-macos-hidden-apps = true

# Mouse Behavior
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# ==============================================================================
# Key Mapping
# ==============================================================================

[key-mapping]
preset = 'qwerty'

# ==============================================================================
# Gaps
# Inner gaps between windows, outer gaps from monitor edges
# ==============================================================================

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.bottom = 10
outer.top = [{ monitor.main = 5 }, 5]
outer.right = 10
outer.left = 10


# ==============================================================================
# Main Keybindings
# ==============================================================================

[mode.main.binding]

# --- Focus Navigation (Wrap-around) ---
alt-h = 'focus --boundaries-action wrap-around-the-workspace left'
alt-j = 'focus --boundaries-action wrap-around-the-workspace down'
alt-k = 'focus --boundaries-action wrap-around-the-workspace up'
alt-l = 'focus --boundaries-action wrap-around-the-workspace right'

alt-left = 'focus --boundaries-action wrap-around-the-workspace left'
alt-down = 'focus --boundaries-action wrap-around-the-workspace down'
alt-up = 'focus --boundaries-action wrap-around-the-workspace up'
alt-right = 'focus --boundaries-action wrap-around-the-workspace right'

# --- Move Windows ---
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# --- Layout Modification ---
alt-t = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-enter = 'fullscreen'
alt-shift-space = 'layout floating tiling'
alt-y = [
  'focus right',
  'join-with down',
  'layout tiles horizontal',
] # Join focused window with the one to the right into a horizontal tile
alt-b = 'balance-sizes'
alt-r = 'flatten-workspace-tree'

# --- Stack/Join Windows ---
alt-shift-left = 'join-with left'
alt-shift-down = 'join-with down'
alt-shift-up = 'join-with up'
alt-shift-right = 'join-with right'

# --- Resize Windows (coarse: ±100) ---
alt-shift-minus = 'resize smart -100'
alt-shift-equal = 'resize smart +100'

# Workspace-specific settings are grouped by name here, in Window Rules,
# and in Monitor Configuration (TOML requires separate tables).

# --- Workspace w-web ---
alt-1 = 'workspace w-web'
alt-shift-1 = 'move-node-to-workspace w-web'

# --- Workspace a-web ---
alt-2 = 'workspace a-web'
alt-shift-2 = 'move-node-to-workspace a-web'

# --- Workspace p-web ---
alt-3 = 'workspace p-web'
alt-shift-3 = 'move-node-to-workspace p-web'

# --- Workspace term ---
alt-q = 'workspace term'
alt-shift-q = 'move-node-to-workspace term'

# --- Workspace code ---
alt-w = 'workspace code'
alt-shift-w = 'move-node-to-workspace code'

# --- Workspace code2 ---
alt-e = 'workspace code2'
alt-shift-e = 'move-node-to-workspace code2'

# --- Workspace chat ---
alt-a = 'workspace chat'
alt-shift-a = 'move-node-to-workspace chat'

# --- Workspace w-mail ---
alt-s = 'workspace w-mail'
alt-shift-s = 'move-node-to-workspace w-mail'

# --- Workspace p-mail ---
alt-d = 'workspace p-mail'
alt-shift-d = 'move-node-to-workspace p-mail'

# --- Workspace w-ai ---
alt-z = 'workspace w-ai'
alt-shift-z = 'move-node-to-workspace w-ai'

# --- Workspace p-ai1 ---
alt-x = 'workspace p-ai1'
alt-shift-x = 'move-node-to-workspace p-ai1'

# --- Workspace p-ai2 ---
alt-c = 'workspace p-ai2'
alt-shift-c = 'move-node-to-workspace p-ai2'

# --- Workspace notes ---
alt-n = 'workspace notes'
alt-shift-n = 'move-node-to-workspace notes'

# --- Workspace media ---
alt-m = 'workspace media'
alt-shift-m = 'move-node-to-workspace media'

alt-tab = 'workspace-back-and-forth'
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# --- Monitor Navigation ---
alt-leftSquareBracket = 'focus-monitor --wrap-around prev'
alt-rightSquareBracket = 'focus-monitor --wrap-around next'
alt-shift-leftSquareBracket = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-rightSquareBracket = 'move-workspace-to-monitor --wrap-around next'

# --- Enter Sub-Modes ---
alt-shift-semicolon = 'mode service'
alt-shift-r = 'mode resize'


# ==============================================================================
# Extra Modes (Service, Resize)
# ==============================================================================

# Service Mode
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Resize Mode (fine: ±50)
[mode.resize.binding]
h = 'resize width -50'
j = 'resize height +50'
k = 'resize height -50'
l = 'resize width +50'
minus = 'resize smart -50'
equal = 'resize smart +50'
enter = 'mode main'
esc = 'mode main'


# ==============================================================================
# Window Rules (Callbacks)
# Workspace assignments and floating window overrides
# ==============================================================================

# --- Workspace w-web ---
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['move-node-to-workspace w-web']

[[on-window-detected]]
if.app-id = 'com.google.chrome'
run = ['move-node-to-workspace w-web']

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['move-node-to-workspace w-web']

[[on-window-detected]]
if.app-id = 'com.brave.Browser'
run = ['move-node-to-workspace w-web']

[[on-window-detected]]
if.app-id = 'net.input.helium'
run = ['move-node-to-workspace w-web']

# --- Workspace term ---
[[on-window-detected]]
if.app-id = 'net.kovidgoyal.kitty'
run = ['move-node-to-workspace term']

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['move-node-to-workspace term']

# --- Workspace code ---
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['move-node-to-workspace code']

# --- Workspace code2 ---
[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['move-node-to-workspace code2']

# --- Workspace chat ---
[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace chat']

# --- Workspace w-mail ---
[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = ['move-node-to-workspace w-mail']

# --- Workspace p-mail ---
[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = ['move-node-to-workspace p-mail']

# --- Workspace w-ai ---
[[on-window-detected]]
if.app-id = 'com.microsoft.m365copilot'
run = ['move-node-to-workspace w-ai']

# --- Workspace p-ai1 ---
[[on-window-detected]]
if.app-id = 'com.openai.codex'
run = ['move-node-to-workspace p-ai1']

[[on-window-detected]]
if.app-id = 'com.openai.chat'
run = ['move-node-to-workspace p-ai1']

# --- Workspace p-ai2 ---

[[on-window-detected]]
if.app-id = 'com.apple.Siri'
run = ['move-node-to-workspace p-ai2']

[[on-window-detected]]
if.app-id = 'net.imput.helium.app.hpkkadlgbdkiimnjhfolkbcmpbmedpja'
run = ['move-node-to-workspace p-ai2']

# --- Workspace notes ---
[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = ['move-node-to-workspace notes']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['move-node-to-workspace notes']

# --- Workspace media ---
[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = ['move-node-to-workspace media']

[[on-window-detected]]
if.app-id = 'com.firecore.infuse'
run = ['move-node-to-workspace media']

# --- Floating Windows ---
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'dev.kdrag0n.MacVirt'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.daisydiskapp.DaisyDisk'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.AppStore'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.stocks'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.objective-see.lulu.app'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.weather'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.microsoft.rdc.macos'
run = ['layout floating']

# ==============================================================================
# Monitor Configuration
# Force workspace-to-monitor assignments
# ==============================================================================

[workspace-to-monitor-force-assignment]
# --- Workspace w-web ---
w-web = ['main']

# --- Workspace a-web ---
a-web = ['main']

# --- Workspace p-web ---
p-web = ['main']

# --- Workspace term ---
term = ['main']

# --- Workspace code ---
code = ['main']

# --- Workspace code2 ---
code2 = ['main']

# --- Workspace chat ---
chat = ['built-in']

# --- Workspace w-mail ---
w-mail = ['built-in']

# --- Workspace p-mail ---
p-mail = ['built-in']

# --- Workspace w-ai ---
w-ai = ['built-in']

# --- Workspace p-ai1 ---
p-ai1 = ['built-in']

# --- Workspace p-ai2 ---
p-ai2 = ['built-in']

# --- Workspace notes ---
notes = ['main']

# --- Workspace media ---
media = ['main']
