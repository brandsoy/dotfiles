# tmux config optimized for kitty on a macOS laptop
# Reload configuration: Prefix r
# TPM install/update: Prefix I / Prefix U

unbind C-b
set -g prefix C-s
bind C-s send-prefix

unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

set -s escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g visual-activity off
set -g focus-events on
set -g status-position top

set -g default-terminal "tmux-256color"
set -g default-command "${SHELL}"
set -g history-limit 100000
set -as terminal-features ",xterm-kitty:RGB:clipboard:focus:title:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:clipboard:focus:title:hyperlinks"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-256color:RGB"
set -g set-clipboard on
set -g allow-passthrough all
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-kitty:extkeys"
set -g set-titles on
set -g set-titles-string "#S:#I.#P #{pane_current_command}"

bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g detach-on-destroy off
bind-key "s" run-shell "$HOME/dotfiles/scripts/tmux/sesh-picker.sh"
bind -N "prefix+a last-session (via sesh) " a run-shell "sesh last || tmux display-message -d 1000 'Only one session'"
bind-key "S" run-shell "$HOME/dotfiles/scripts/tmux/sesh-picker.sh"
bind-key "W" run-shell "sesh window \"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\""

setw -g mode-keys vi
set -s copy-command ''
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy'
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command wl-copy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'

if-shell '[ -f "$HOME/.config/tmux/theme.conf" ]' 'source-file "$HOME/.config/tmux/theme.conf"'
run-shell "$HOME/dotfiles/scripts/tmux/minimal-theme/minimal.tmux"
run '~/.tmux/plugins/tpm/tpm'
