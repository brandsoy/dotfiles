# tmux config optimized for kitty on a macOS laptop
# Reload config: Prefix r
# TPM install/update: Prefix I / Prefix U

##### Core behavior #####

# Prefix key. If C-s ever freezes the terminal, add `stty -ixon` to your shell rc.
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# Reload configuration
unbind r
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Faster escape handling for Vim/Neovim while keeping Alt/Meta usable.
set -s escape-time 10

# Keep windows/panes numbered naturally.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# macOS laptop ergonomics
set -g mouse on
set -g visual-activity off
set -g focus-events on
set -g status-position top

##### Kitty / terminal integration #####

# Inside tmux, advertise tmux's own terminal. Keep kitty as TERM outside tmux.
set -g default-terminal "tmux-256color"

# Safer default-shell behavior on macOS if needed

set -g default-command "${SHELL}"

# More scrollback

set -g history-limit 100000

# True color, clipboard, focus, title, and hyperlink support when tmux runs in kitty.
# tmux 3.6 understands terminal-features; terminal-overrides is kept as fallback.
set -as terminal-features ",xterm-kitty:RGB:clipboard:focus:title:hyperlinks"
set -as terminal-features ",xterm-256color:RGB:clipboard:focus:title:hyperlinks"
set -ga terminal-overrides ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-256color:RGB"

# Let tmux and apps use OSC 52 clipboard and kitty graphics/protocol passthrough.
set -g set-clipboard on
set -g allow-passthrough all

# Better modified-key handling, but let apps opt in.
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ",xterm-kitty:extkeys"

# Keep the macOS/kitty window title useful.
set -g set-titles on
set -g set-titles-string "#S:#I.#P #{pane_current_command}"

##### Panes and windows #####

# Split in the current pane's working directory.
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation shortcuts.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with repeatable Vim-style keys.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# # Custom tmux helper script.
# set -g popup-border-lines rounded
# bind s display-popup -b rounded -E "$HOME/dotfiles/scripts/tmux/switch-window.sh"

set -g detach-on-destroy off # don't exit from tmux when closing a session

# Sesh binding
bind-key "s" display-popup -E -w 40% "sesh connect \"$(
  sesh list -i | gum filter --limit 1 --placeholder 'Pick a sesh' --prompt='⚡' --no-strip-ansi
)\""

bind -N "prefix+a last-session (via sesh) " a run-shell "sesh last || tmux display-message -d 1000 'Only one session'"

bind-key "S" run-shell "sesh connect \"$(
    sesh list --icons | fzf-tmux -p 80%,70% \
      --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
      --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
      --bind 'tab:down,btab:up' \
      --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
      --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
      --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
      --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
      --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
      --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
      --preview-window 'right:55%' \
      --preview 'sesh preview {}'
  )\""

bind-key "W" run-shell "sesh window \"$(sesh window | fzf-tmux -p 60%,50% --prompt '🪟  ')\""


##### Copy mode / clipboard #####

setw -g mode-keys vi

# OSC 52 works as the fallback; use the native clipboard when available.
set -s copy-command ''
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy'
if-shell 'test -n "$WAYLAND_DISPLAY" && command -v wl-copy >/dev/null 2>&1' 'set -s copy-command wl-copy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel

##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'christoomey/vim-tmux-navigator'

##### Theme #####

# Load synced theme overrides if present.
if-shell '[ -f "$HOME/.config/tmux/theme.conf" ]' 'source-file "$HOME/.config/tmux/theme.conf"'

# Theme (vendored locally, no TPM plugin)
run-shell "$HOME/dotfiles/scripts/tmux/minimal-theme/minimal.tmux"

# Initialize TPM. Keep this at the end.
run '~/.tmux/plugins/tpm/tpm'
