# RWTH dark theme — https://github.com/mryodo/rwth.nvim
# Palette: #00182D background, #E8F1FA foreground

[mgr]
cwd = { fg = "#8EBAE5", bold = true }
hovered = { reversed = true }
preview_hovered = { underline = true }

find_keyword = { fg = "#FDD48F", bold = true, italic = true, underline = true }
find_position = { fg = "#F19EB1", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#57AB27", bg = "#57AB27" }
marker_cut = { fg = "#CC071E", bg = "#CC071E" }
marker_marked = { fg = "#89CCCF", bg = "#89CCCF" }
marker_selected = { fg = "#FDD48F", bg = "#FDD48F" }

count_copied = { fg = "#00182D", bg = "#57AB27" }
count_cut = { fg = "#E8F1FA", bg = "#CC071E" }
count_selected = { fg = "#00182D", bg = "#FDD48F" }

border_symbol = "│"
border_style = { fg = "#646567" }

tab_active = { fg = "#00182D", bg = "#8EBAE5", bold = true }
tab_inactive = { fg = "#646567", bg = "#00182D" }
tab_width = 1

[tabs]
active = { fg = "#00182D", bg = "#8EBAE5", bold = true }
inactive = { fg = "#646567", bg = "#000C17" }

[mode]
normal_main = { fg = "#00182D", bg = "#8EBAE5", bold = true }
normal_alt = { fg = "#8EBAE5", bg = "#000C17" }
select_main = { fg = "#00182D", bg = "#B8D698", bold = true }
select_alt = { fg = "#B8D698", bg = "#000C17" }
unset_main = { fg = "#00182D", bg = "#F19EB1", bold = true }
unset_alt = { fg = "#F19EB1", bg = "#000C17" }

[status]
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
progress_label = { fg = "#E8F1FA", bold = true }
progress_normal = { fg = "#8EBAE5", bg = "#000C17" }
progress_error = { fg = "#CC071E", bg = "#000C17" }
perm_sep = { fg = "#646567" }
perm_type = { fg = "#8EBAE5" }
perm_read = { fg = "#FDD48F" }
perm_write = { fg = "#E69679" }
perm_exec = { fg = "#57AB27" }

[pick]
border = { fg = "#8EBAE5" }
active = { fg = "#F19EB1", bold = true }
inactive = { fg = "#E8F1FA" }

[input]
border = { fg = "#8EBAE5" }
title = { fg = "#E8F1FA" }
value = { fg = "#E8F1FA" }
selected = { reversed = true }

[cmp]
border = { fg = "#8EBAE5" }

[tasks]
border = { fg = "#8EBAE5" }
title = { fg = "#E8F1FA" }
hovered = { fg = "#F19EB1", underline = true }

[which]
mask = { bg = "#000C17" }
cand = { fg = "#89CCCF" }
rest = { fg = "#646567" }
desc = { fg = "#F19EB1" }
separator = "  "
separator_style = { fg = "#646567" }

[help]
on = { fg = "#89CCCF" }
run = { fg = "#F19EB1" }
hovered = { reversed = true, bold = true }
footer = { fg = "#00182D", bg = "#E8F1FA" }

[notify]
title_info = { fg = "#57AB27" }
title_warn = { fg = "#FDD48F" }
title_error = { fg = "#CC071E" }

[filetype]
rules = [
  { mime = "image/*", fg = "#89CCCF" },
  { mime = "{audio,video}/*", fg = "#FDD48F" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#F19EB1" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "#B8D698" },
  { url = "*", fg = "#E8F1FA" },
  { url = "*/", fg = "#8EBAE5", bold = true },
]
