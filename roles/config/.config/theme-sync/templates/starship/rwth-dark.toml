"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$all"
palette = "rwth-dark"

[palettes.rwth-dark]
rwth_bg = "{{palettes_rwth_dark_rwth_bg}}"
rwth_fg = "{{palettes_rwth_dark_rwth_fg}}"
rwth_muted = "{{palettes_rwth_dark_rwth_muted}}"
rwth_blue = "{{palettes_rwth_dark_rwth_blue}}"
rwth_blue_bright = "{{palettes_rwth_dark_rwth_blue_bright}}"
rwth_cyan = "{{palettes_rwth_dark_rwth_cyan}}"
rwth_green = "{{palettes_rwth_dark_rwth_green}}"
rwth_green_bright = "{{palettes_rwth_dark_rwth_green_bright}}"
rwth_yellow = "{{palettes_rwth_dark_rwth_yellow}}"
rwth_orange = "{{palettes_rwth_dark_rwth_orange}}"
rwth_red = "{{palettes_rwth_dark_rwth_red}}"
rwth_magenta = "{{palettes_rwth_dark_rwth_magenta}}"
rwth_pink = "{{palettes_rwth_dark_rwth_pink}}"

[directory]
style = "bold rwth_blue"
truncation_length = 4
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold rwth_magenta"

[git_status]
format = "($ahead_behind$staged$modified$untracked$deleted$conflicted)"
ahead = "[⇡$count ](bold rwth_blue)"
behind = "[⇣$count ](bold rwth_blue)"
diverged = "[⇡$ahead_count⇣$behind_count ](bold rwth_blue)"
staged = "[+$count ](bold rwth_green_bright)"
modified = "[●$count ](bold rwth_yellow)"
untracked = "[?$count ](bold rwth_cyan)"
deleted = "[✘$count ](bold rwth_orange)"
conflicted = "[⚡$count ](bold rwth_red)"

[cmd_duration]
style = "rwth_yellow"

[character]
success_symbol = "[❯](bold rwth_green)"
error_symbol = "[❯](bold rwth_red)"
vimcmd_symbol = "[❮](bold rwth_blue)"

[nodejs]
style = "rwth_green"

[rust]
style = "rwth_orange"

[golang]
style = "rwth_cyan"

[python]
style = "rwth_yellow"

[package]
style = "rwth_magenta"
