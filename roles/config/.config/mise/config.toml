[settings]
# Keep Ruby project files (.ruby-version) working without making Ruby global.
idiomatic_version_file_enable_tools = ["ruby"]

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = true

[tools]
# Shared shell/workstation tools. Project runtimes and build tools belong in
# each project's mise.toml (or that ecosystem's native manifest).
gum = "latest"
uv = "latest"
"pipx:harlequin[odbc]" = "latest"
"github:can1357/oh-my-pi" = "latest"

# Linux packages vary by distro/repository; avoid custom binary-download scripts.
# Homebrew owns these on macOS.
"github:jesseduffield/lazygit" = { version = "latest", os = ["linux"] }
"github:jesseduffield/lazydocker" = { version = "latest", os = ["linux"] }
node = "lts"
biome = "latest"
go = "latest"
python = "3.12.12"
