[settings]
idiomatic_version_file_enable_tools = ["ruby"]
experimental = true

[settings.pipx]
uvx = true

[settings.python]
uv_venv_auto = true

[settings.ruby]

[tools]
ansible = "latest"
bun = "latest"
dotnet = "latest"
go = "latest"
gum = "latest"
node = "lts"
pnpm = "latest"
python = "latest"
uv = "latest"
terraform = "latest"
"npm:typescript" = "latest"
"npm:@biomejs/biome" = "latest"
"npm:@typespec/compiler" = "latest"
"dotnet:dotnet-ef" = "latest"
rust = "latest"
"go:github.com/a-h/templ/cmd/templ" = "latest"
"go:github.com/air-verse/air" = "latest"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = "latest"
"go:github.com/sqlc-dev/sqlc/cmd/sqlc" = "latest"
"cargo:htmx-lsp" = "latest"
"cargo:jinja-lsp" = "latest"
"pipx:harlequin[odbc]" = "latest"
"github:can1357/oh-my-pi" = "latest"
# Linux packages vary by distro/repository; avoid custom binary-download scripts.
# Homebrew owns these on macOS.
"github:jesseduffield/lazygit" = { version = "latest", os = ["linux"] }
"github:jesseduffield/lazydocker" = { version = "latest", os = ["linux"] }
