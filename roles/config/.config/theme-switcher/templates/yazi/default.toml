[cmp]
border = { fg = "{{cmp_border_fg}}" }

[tasks]
border = { fg = "{{tasks_border_fg}}" }
title = { fg = "{{tasks_title_fg}}" }
hovered = { fg = "{{tasks_hovered_fg}}", underline = true }

[which]
mask = { bg = "{{which_mask_bg}}" }
