footer = { fg = "{{help_footer_fg}}", bg = "{{help_footer_bg}}" }

[notify]
title_info = { fg = "{{notify_title_info_fg}}" }
title_warn = { fg = "{{notify_title_warn_fg}}" }
title_error = { fg = "{{notify_title_error_fg}}" }

[filetype]
rules = [
  { mime = "image/*", fg = "{{filetype_rules_fg}}" },
  { mime = "{audio,video}/*", fg = "{{filetype_rules_fg_2}}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{filetype_rules_fg_3}}" },
  { mime = "application/{pdf,doc,rtf,odt,docx,xlsx,pptx}", fg = "{{filetype_rules_fg_4}}" },
  { url = "*", fg = "{{filetype_rules_fg_5}}" },
  { url = "*/", fg = "{{filetype_rules_fg_6}}", bold = true },
]
