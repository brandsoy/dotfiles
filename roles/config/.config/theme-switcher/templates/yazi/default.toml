marker_copied = { fg = "{{mgr_marker_copied_fg}}", bg = "{{mgr_marker_copied_bg}}" }
marker_cut = { fg = "{{mgr_marker_cut_fg}}", bg = "{{mgr_marker_cut_bg}}" }
marker_marked = { fg = "{{mgr_marker_marked_fg}}", bg = "{{mgr_marker_marked_bg}}" }
marker_selected = { fg = "{{mgr_marker_selected_fg}}", bg = "{{mgr_marker_selected_bg}}" }

count_copied = { fg = "{{mgr_count_copied_fg}}", bg = "{{mgr_count_copied_bg}}" }
