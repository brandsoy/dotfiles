# macOS laptop + tmux optimized kitty config

# # Max performance / lowest latency settings
# input_delay 0
# repaint_delay 2
# sync_to_monitor no
# wayland_enable_ime no


# Performance / latency
# Keep vsync enabled on macOS for smooth rendering and lower laptop power use.
repaint_delay    10
input_delay      0
sync_to_monitor  yes
cursor_trail  1
# macOS keyboard behavior
# Left Option sends Alt/Meta (great for tmux, shells, Vim/Neovim, Emacs).
# Right Option remains the normal macOS Option key for special characters.
macos_option_as_alt left
macos_quit_when_last_window_closed yes
allow_remote_control yes
listen_on unix:/tmp/kitty

# Font
# BEGIN_KITTY_FONTS
font_family      family="GeistMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
font_size 15.0
adjust_line_height 120%
disable_ligatures always

# Window
window_margin_width 10 
hide_window_decorations titlebar-only
macos_show_window_title_in none
scrollback_lines 10000

# Mouse
mouse_hide_wait -1 

# Clipboard / selection
copy_on_select clipboard
strip_trailing_spaces smart

# tmux-friendly terminal behavior
# TERM should remain xterm-kitty; install kitty's terminfo on remote hosts if needed.
term xterm-kitty
# Hold Shift while selecting/clicking to bypass tmux or full-screen terminal apps (kitty default).

# Opacity range: 0.0 (transparent) to 1.0 (opaque)
background_opacity 0.93

# macOS-native background blur radius (1-64)
# Values between 15-30 provide clean visual separation with minimal GPU cost
background_blur 20

# Synchronize rendering with display refresh rate (prevents tearing and GPU overdraw)
sync_to_monitor yes

# Match screen refresh rate (e.g., 60 for 60Hz, 120 for ProMotion displays)
# Setting this too high forces unnecessary repaints during scrolling
fps 120

# Delay (in milliseconds) before drawing changes to reduce CPU/GPU frame queuing
input_delay 3
repaint_delay 10

# Disable ligatures under cursor or entirely to save frame draw times
disable_ligatures cursor

# Force standard text geometry scaling for Retina displays
box_drawing_scale 0.001, 1, 1.5, 2

# Disable window drop shadows managed by the terminal
window_border_width 0
draw_minimal_borders yes

# Avoid redrawing non-visible tab areas
tab_bar_style powerline

# Handy macOS shortcuts (explicit, so they survive future default changes)
map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard
map cmd+k clear_terminal scroll active
map cmd+plus  change_font_size all +1.0
map cmd+minus change_font_size all -1.0
map cmd+0     change_font_size all 0
map cmd+enter toggle_fullscreen

# Theme
# Baseline plus an optional, untracked theme-sync override.
include ../theme-sync/themes/catppuccin-mocha/kitty.conf
include auto/theme.conf
